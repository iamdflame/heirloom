name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'evals/*.json'
      - 'docs/business-plan.md'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /heirloom/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
