name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'evals/*.json'
      - 'docs/business-plan.md'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site lives on Vercel (https://heirloom-proof.vercel.app). GitHub Pages only serves a tiny
  # redirect page, so old links to iamdflame.github.io/heirloom/ keep working (hash deep links too).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Heirloom has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://heirloom-proof.vercel.app/">
          <meta http-equiv="refresh" content="0; url=https://heirloom-proof.vercel.app/">
          <script>location.replace('https://heirloom-proof.vercel.app/' + location.hash)</script>
          <style>body{background:#08090A;color:#ECE6DA;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#E6CB8E}</style>
          </head>
          <body><p>Heirloom now lives at <a href="https://heirloom-proof.vercel.app/">heirloom-proof.vercel.app</a>.</p></body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
