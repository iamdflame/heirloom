[project]
name = "heirloom"
version = "0.1.0"
description = "An agent that keeps end-of-life software patched."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "litellm",
    "neatlogs[litellm]",
    "httpx",
    "gitpython",
    "libcst",
    "coverage",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
heirloom = "heirloom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heirloom"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["heirloom", "tests"]

[[tool.mypy.overrides]]
module = ["neatlogs", "neatlogs.*", "litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
